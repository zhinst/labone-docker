name: build and deploy to Dockerhub

on:
  push:
    tags:
      - 'v*'

# Serialize deploys so concurrent tag pushes cannot race on the latest tags
concurrency:
  group: dockerhub-deploy
  cancel-in-progress: false


jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        name: Set LabOne version
        run: |
          VER=$(cat labone_version.txt)
          TAG=${GITHUB_REF_NAME#v}
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match labone_version.txt ('$VER')"
            exit 1
          fi
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "SHORT_VERSION=${VER:0:5}" >> $GITHUB_ENV
      -
        name: Determine if latest public release
        run: |
          VER_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          HIGHEST_VER=$(git ls-remote --tags --refs origin 'v*' \
                    | sed 's#.*refs/tags/##' | grep -E "$VER_PATTERN" \
                    | sort -V | tail -n1)
          if [[ "$GITHUB_REF_NAME" =~ $VER_PATTERN ]] && [ "$GITHUB_REF_NAME" = "$HIGHEST_VER" ]; then
            echo "IS_LATEST=true" >> $GITHUB_ENV
          else
            echo "IS_LATEST=false" >> $GITHUB_ENV
            echo "::notice::$GITHUB_REF_NAME is not the newest public release ($HIGHEST_VER); latest tags are not updated"
          fi
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64,arm'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build LabOne All-in-One Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            zhinst/labone:${{ env.VERSION }}-full
            zhinst/labone:${{ env.SHORT_VERSION }}-full
            ${{ env.IS_LATEST == 'true' && 'zhinst/labone:latest-full' || '' }}
            ${{ env.IS_LATEST == 'true' && 'zhinst/labone:latest' || '' }}
          build-args:
            LABONE_VERSION=${{ env.VERSION }}
      -
        name: Build LabOne Data Server Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            zhinst/labone:${{ env.VERSION }}-dataserver
            zhinst/labone:${{ env.SHORT_VERSION }}-dataserver
            ${{ env.IS_LATEST == 'true' && 'zhinst/labone:latest-dataserver' || '' }}
          target: labone_dataserver
          build-args:
            LABONE_VERSION=${{ env.VERSION }}
      -
        name: Build LabOne Web Server Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            zhinst/labone:${{ env.VERSION }}-webserver
            zhinst/labone:${{ env.SHORT_VERSION }}-webserver
            ${{ env.IS_LATEST == 'true' && 'zhinst/labone:latest-webserver' || '' }}
          target: labone_webserver
          build-args:
            LABONE_VERSION=${{ env.VERSION }}
